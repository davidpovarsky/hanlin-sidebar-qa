name: HanlinSidebarQA
options:
  bundleIdPrefix: com.goldypov
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "1.1.0"
targets:
  HanlinSidebarQA:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Hanlin Sidebar
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldypov.hanlinsidebarqa
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  HanlinSidebarQATests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HanlinSidebarQA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  HanlinSidebarQA:
    build:
      targets:
        HanlinSidebarQA: all
    test:
      targets: [HanlinSidebarQATests]
      gatherCoverageData: false
      randomExecutionOrder: false
