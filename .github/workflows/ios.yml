name: iOS Simulator QA
on:
  push:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Available simulators
        run: xcrun simctl list devices available
      - name: Build iOS simulator
        run: xcodebuild -project HanlinSidebarQA.xcodeproj -scheme HanlinSidebarQA -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run iPhone and iPad UI tests
        run: |
          set -o pipefail
          for DEVICE_NAME in "iPhone 16" "iPad Air 11-inch (M3)"; do
            SAFE_NAME=$(echo "$DEVICE_NAME" | tr -cs '[:alnum:]' '_')
            xcodebuild -project HanlinSidebarQA.xcodeproj -scheme HanlinSidebarQA -destination "platform=iOS Simulator,name=$DEVICE_NAME,OS=26.2" -resultBundlePath "$RUNNER_TEMP/$SAFE_NAME.xcresult" CODE_SIGNING_ALLOWED=NO test
          done
      - name: Verify iPad multitasking Info.plist
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/HanlinSidebarQA.app' -type d | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$APP/Info.plist" | grep -i false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-ui-results
          path: ${{ runner.temp }}/*.xcresult
      - name: Build unsigned iOS device app
        if: always()
        run: xcodebuild -project HanlinSidebarQA.xcodeproj -scheme HanlinSidebarQA -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator and device app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanlin-build-outputs
          path: |
            ${{ runner.temp }}/device/Build/Products/Release-iphoneos/HanlinSidebarQA.app
            ${{ runner.temp }}/hanlin-ui.xcresult
