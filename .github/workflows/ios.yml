name: iOS Simulator QA
on:
  push:
    paths:
      - 'App/**'
      - 'Tests/**'
      - 'ci/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner pool
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15, macos-26]
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-qa-${{ github.ref }}-${{ inputs.runner || 'macos-15-intel' }}
  cancel-in-progress: false
jobs:
  simulator:
    name: UI tests (${{ matrix.device }})
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad, ipad-window]
    env:
      DEVICE_FAMILY: ${{ matrix.device == 'iphone' && 'iphone' || 'ipad' }}
      QA_KIND: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - name: Select matching Xcode and simulator
        run: python3 ci/select_simulator.py
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          xcodebuild -project HanlinSidebarQA.xcodeproj -list
      - name: Boot simulator with software keyboard
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Run real UI interactions
        run: |
          set -o pipefail
          if [[ "$QA_KIND" == "ipad-window" ]]; then
            SELECTOR=HanlinSidebarQATests/WindowResizeDiscoveryTests/testActualIPadWindowNarrowAndRestore
          else
            SELECTOR=HanlinSidebarQATests/HanlinSidebarQATests
          fi
          xcodebuild -project HanlinSidebarQA.xcodeproj -scheme HanlinSidebarQA \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/derived" -resultBundlePath "$RUNNER_TEMP/qa.xcresult" \
            -parallel-testing-enabled NO "-only-testing:$SELECTOR" CODE_SIGNING_ALLOWED=NO test \
            | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Verify built universal and resizable application
        run: |
          python3 ci/verify_app.py "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/HanlinSidebarQA.app" iPhoneSimulator > "$RUNNER_TEMP/bundle-verification.json"
      - name: Export screenshots and structured test results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if [[ -d "$RUNNER_TEMP/qa.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/qa.xcresult" > "$RUNNER_TEMP/evidence/summary.json"
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/qa.xcresult" > "$RUNNER_TEMP/evidence/tests.json"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/qa.xcresult" --output-path "$RUNNER_TEMP/evidence/attachments"
          fi
      - name: Require actual passed tests
        env:
          EXPECTED_TESTS: ${{ matrix.device == 'ipad-window' && '1' || '9' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path(os.environ['RUNNER_TEMP'], 'evidence/summary.json').read_text())
          print(json.dumps(s, indent=2))
          assert s['passedTests'] >= int(os.environ['EXPECTED_TESTS']), 'Missing executed UI tests'
          assert s['failedTests'] == 0, 'Failed UI tests'
          assert s['skippedTests'] == 0, 'Skipped UI tests'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.device }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/qa.xcresult
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/environment.json
            ${{ runner.temp }}/bundle-verification.json
  package:
    name: Package verified SideStore IPA
    needs: simulator
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 20
    env:
      DEVICE_FAMILY: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: python3 ci/select_simulator.py
      - name: Build release for physical iPhone and iPad
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project HanlinSidebarQA.xcodeproj -scheme HanlinSidebarQA \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build | tee "$RUNNER_TEMP/device-build.log"
      - name: Verify and package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/HanlinSidebarQA.app"
          mkdir -p "$RUNNER_TEMP/export/Payload"
          python3 ci/verify_app.py "$APP" iPhoneOS > "$RUNNER_TEMP/export/bundle-verification.json"
          ditto "$APP" "$RUNNER_TEMP/export/Payload/HanlinSidebarQA.app"
          cd "$RUNNER_TEMP/export"
          /usr/bin/zip -qry HanlinSidebarQA.ipa Payload
          shasum -a 256 HanlinSidebarQA.ipa > HanlinSidebarQA.ipa.sha256
          printf '%s\n' "$GITHUB_SHA" > tested-commit.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('HanlinSidebarQA.ipa') as z:
              names=z.namelist()
              assert 'Payload/HanlinSidebarQA.app/Info.plist' in names
              exe=z.getinfo('Payload/HanlinSidebarQA.app/HanlinSidebarQA')
              assert (exe.external_attr >> 16) & 0o111, 'Executable permissions missing'
              assert all('\\' not in p for p in names), 'Invalid Windows ZIP separators'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HanlinSidebarQA-SideStore
          retention-days: 30
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/*.sha256
            ${{ runner.temp }}/export/tested-commit.txt
            ${{ runner.temp }}/export/bundle-verification.json
            ${{ runner.temp }}/device-build.log
